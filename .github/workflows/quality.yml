name: Quality

on:
  push:
  pull_request:

jobs:
  unit-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - run: node scripts/evaluate.js
